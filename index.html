<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 에이전트로 다시 설계하는 빅데이터 활용</title>
<style>html, body { margin: 0; height: 100%; background: #05041c; }</style>
<script>
  // 발표 모드로 이동한다. ?p=12 를 붙이면 12번 장에서 시작한다.
  const q = new URLSearchParams(location.search);
  location.replace('reel/index.html?render=1&deck=1' + (q.get('p') ? '&p=' + q.get('p') : ''));
</script>
<noscript><a href="reel/index.html?render=1&amp;deck=1">슬라이드 열기</a></noscript>
</html>
